[project]
name = "mellea-contribs-docs-site"
version = "0.0.0"
description = "Static site generator for the mellea-contribs GitHub Pages index. Not published."
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1",
    "markdown>=3.6",
    "Pygments>=2.17",
    "packaging>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
