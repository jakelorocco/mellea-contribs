<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "mellea-contribs" }}</title>
<link rel="stylesheet" href="{{ asset('static/style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ home_url() }}">mellea-contribs</a>
  <nav>
    <a href="https://github.com/{{ build.repo }}">GitHub</a>
    <a href="https://mellea.ai/">mellea.ai</a>
  </nav>
</header>
<main>
{% block content %}{{ content|safe }}{% endblock %}
</main>
<footer class="site-footer">
  <p>
    Built {{ build.timestamp }}{% if build.sha %} · <code>{{ build.sha }}</code>{% endif %}
    · <a href="https://github.com/{{ build.repo }}">{{ build.repo }}</a>
  </p>
</footer>
</body>
</html>
